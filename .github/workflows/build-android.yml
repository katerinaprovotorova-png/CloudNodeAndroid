name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Native Build (Force Rebuild)
        run: |
          chmod +x run
          echo "Building libcore from scratch..."
          ./run lib core
      
      - name: Verify and Upload libcore.aar
        run: |
          echo "=== Checking app/libs directory ==="
          mkdir -p app/libs
          ls -la app/libs/
          if [ -f "app/libs/libcore.aar" ]; then
            echo "✅ SUCCESS: libcore.aar was created!"
            ls -lh app/libs/libcore.aar
          else
            echo "❌ ERROR: libcore.aar was NOT created!"
            echo "Listing root directory to debug:"
            ls -la
            exit 1
          fi

      - name: Upload libcore.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build and Sign CloudNode APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'
      
      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
      
      - name: Download libcore.aar from LibCore job
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/
      
      - name: Verify libcore.aar is present
        run: |
          echo "=== Verifying libcore.aar in build job ==="
          ls -la app/libs/
          if [ -f "app/libs/libcore.aar" ]; then
            echo "✅ libcore.aar is ready for Gradle!"
          else
            echo "❌ libcore.aar is missing!"
            exit 1
          fi
      
      - name: Clean Build
        run: |
          chmod +x gradlew
          ./gradlew clean
      
      - name: Build OSS Release APK
        env:
          BUILD_PLUGIN: none
        run: |
          chmod +x run
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon
      
      - name: Sign APK with apksigner
        run: |
          keytool -genkey -v -keystore cloudnode.keystore -alias cloudnode -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CloudNode, OU=CloudNode, O=CloudNode, L=Moscow, ST=Moscow, C=RU"
          
          APK="app/build/outputs/apk/oss/release/app-oss-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk/oss/release -name "*arm64-v8a*.apk" | head -n 1)
          fi
          
          echo "Found APK to sign: $APK"
          
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          apksigner sign --ks cloudnode.keystore \
            --ks-key-alias cloudnode \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 21 \
            "$APK"
          
          mv "$APK" "CloudNode-Release.apk"
      
      - name: Upload CloudNode APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Release-APK
          path: CloudNode-Release.apk

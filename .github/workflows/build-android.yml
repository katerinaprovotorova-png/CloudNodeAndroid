name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Makefile
        run: find . -name "Makefile" -type f

      - name: List libcore directory
        run: ls -la libcore/ || echo "libcore folder not found"

      - name: Check gradle tasks
        run: ./gradlew tasks --all | grep -i "core\|libcore\|go"

name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go (Required for NekoBox Core)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Grant execute permissions
        run: chmod +x gradlew Makefile

      - name: Fetch/Build NekoBox Core (The Engine)
        # Эта команда скачивает или компилирует недостающее ядро libcore
        run: make core

      - name: Clean Project
        run: ./gradlew clean --no-daemon

      - name: Build Fdroid Release APK
        run: ./gradlew app:assembleFdroidRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Fdroid-Release-APK
          path: app/build/outputs/apk/fdroid/release/*.apk

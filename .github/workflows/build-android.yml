name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x run
          ./run lib core

  build:
    name: Build and Sign CloudNode APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'
      
      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
      
      - name: Clean Build
        run: |
          chmod +x gradlew
          ./gradlew clean
      
      - name: Build OSS Release APK
        env:
          BUILD_PLUGIN: none
        run: |
          chmod +x run
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:assembleOssRelease --no-daemon
      
      - name: Sign APK with apksigner
        run: |
          # 1. Создаем ключ подписи
          keytool -genkey -v -keystore cloudnode.keystore -alias cloudnode -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CloudNode, OU=CloudNode, O=CloudNode, L=Moscow, ST=Moscow, C=RU"
          
          # 2. Находим ИМЕННО универсальный APK (он работает на всех телефонах)
          APK="app/build/outputs/apk/oss/release/app-oss-release.apk"
          if [ ! -f "$APK" ]; then
            # Если универсального нет, берем строго arm64-v8a (для 99% телефонов)
            APK=$(find app/build/outputs/apk/oss/release -name "*arm64-v8a*.apk" | head -n 1)
          fi
          
          echo "Found APK to sign: $APK"
          
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          # 3. Подписываем через современный apksigner (гарантирует установку на Android 7+)
          apksigner sign --ks cloudnode.keystore \
            --ks-key-alias cloudnode \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 21 \
            "$APK"
          
          # 4. Переименовываем в финальное имя
          mv "$APK" "CloudNode-Release.apk"
      
      - name: Upload CloudNode APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Release-APK
          path: CloudNode-Release.apk

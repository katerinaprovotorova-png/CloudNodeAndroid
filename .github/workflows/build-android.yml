name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          chmod +x run
          ./run lib core

  build:
    name: Build and Sign CloudNode APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'
      
      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
      
      - name: RADICAL CLEAN (Удаляем все следы старых сборок)
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf app/build/
      
      - name: Build OSS Release APK
        env:
          BUILD_PLUGIN: none
        run: |
          chmod +x run gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          # --no-build-cache гарантирует, что старые файлы NekoBox не будут использованы
          ./gradlew clean app:assembleOssRelease --no-build-cache --no-daemon
      
      - name: Sign APK
        run: |
          keytool -genkey -v -keystore cloudnode.keystore -alias cloudnode -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=CloudNode, OU=CloudNode, O=CloudNode, L=Moscow, ST=Moscow, C=RU"
          
          find app/build/outputs/apk -name "*.apk" -type f | while read apk; do
            echo "Processing: $apk"
            zip -d "$apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore cloudnode.keystore -storepass android -keypass android "$apk" cloudnode
            zipalign -f 4 "$apk" "${apk%.apk}-signed.apk"
          done
      
      - name: Rename to CloudNode
        run: |
          mkdir -p final_apk
          find app/build/outputs/apk -name "*-signed.apk" -type f -exec mv {} final_apk/CloudNode-Release.apk \;
      
      - name: Upload CloudNode APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Release-APK
          path: final_apk/CloudNode-Release.apk

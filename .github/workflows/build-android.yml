name: Build CloudNode APK

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Указываем конкретные пакеты, которые нужны для сборки
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List available build tasks
        run: ./gradlew tasks --all --no-daemon | grep -i "assemble"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNode-Release-APK
          path: app/build/outputs/apk/universalRelease/app-universal-release.apk
